name: OpenAPI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  openapi-lint:
    uses: Solierrr/docs-warehouse/.github/workflows/openapi-lint.yml@main
    with:
      contract: openapi.yaml
      export-command: python -m pip install --require-hashes --requirement requirements.lock && make openapi PY=python
      python-version: "3.12"
