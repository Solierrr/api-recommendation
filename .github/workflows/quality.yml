name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.4

      - name: Lint
        run: |
          if [ -f pyproject.toml ]; then
            # Roda o lint completo apenas nos diretórios que já existem nesta branch.
            TARGETS="app"
            [ -d tests ] && TARGETS="$TARGETS tests"
            [ -d scripts ] && TARGETS="$TARGETS scripts"
            ruff check $TARGETS
          else
            # Nesta fase do projeto ainda nao ha config de lint (pyproject.toml) nem
            # a suite de testes; roda so as checagens de erros reais (F: imports nao
            # usados, nomes indefinidos etc.), evitando reprovar por estilo antes que
            # a configuracao de lint completa exista no repositorio.
            ruff check app --isolated --select F
          fi
