name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PIP_ONLY_BINARY: ":all:"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Lint
        run: python -m ruff check app tests

      - name: Format check
        run: python -m ruff format --check app tests

      - name: Type check
        run: python -m mypy app

      - name: Static security analysis
        run: python -m bandit -r app -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit --require-hashes --requirement requirements.lock
