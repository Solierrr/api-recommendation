name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==26.2.1
          if [ -f requirements-dev.txt ]; then
            pip install --only-binary=:all: -r requirements-dev.txt
          else
            pip install --only-binary=:all: ruff==0.16.4
          fi

      - name: Lint and format check
        run: |
          # Roda o lint/format apenas nos diretorios que ja existem nesta branch.
          TARGETS="app"
          [ -d tests ] && TARGETS="$TARGETS tests"
          [ -d scripts ] && TARGETS="$TARGETS scripts"
          if [ -f pyproject.toml ]; then
            ruff check $TARGETS
            ruff format --check $TARGETS
          else
            # Nesta fase do projeto ainda nao ha config de lint/format
            # (pyproject.toml); roda so as checagens de erro real (F: imports
            # nao usados, nomes indefinidos etc.), evitando reprovar por estilo
            # antes que a configuracao completa exista no repositorio.
            ruff check app --isolated --select F
          fi
