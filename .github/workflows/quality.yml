name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==26.2.1
          # Todos os requisitos usam pins exatos e o pip-audit é bloqueante.
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt  # NOSONAR

      - name: Lint
        run: python -m ruff check app tests

      - name: Format check
        run: python -m ruff format --check app tests

      - name: Type check
        run: python -m mypy app

      - name: Static security analysis
        run: python -m bandit -r app -q

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
