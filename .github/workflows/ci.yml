name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEO4J_INTEGRATION_URI: bolt://localhost:7687
      NEO4J_INTEGRATION_USER: neo4j
      NEO4J_INTEGRATION_PASSWORD: test-password-for-ci
      NEO4J_INTEGRATION_ALLOW_DESTRUCTIVE: "true"
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password-for-ci
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: pip==26.2.1
          # Todos os requisitos usam pins exatos e o pip-audit é bloqueante.
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt  # NOSONAR

      - name: Run tests with coverage gate
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65 \
            --junitxml=test-results.xml

      - name: Compile source and tests
        run: python -m compileall -q app tests

      - name: Build and smoke-test container
        run: |
          docker build --tag api-recommendation:ci .
          docker run --rm \
            --entrypoint python \
            --env APP_ENVIRONMENT=test \
            --env NEO4J_URI=bolt://localhost:7687 \
            --env NEO4J_USER=neo4j \
            --env NEO4J_PASSWORD=test-password \
            --env DB_URL=jdbc:postgresql://localhost:5432/test \
            --env DB_USERNAME=test \
            --env DB_PASSWORD=test-password \
            --env SYNC_API_KEY=test-sync-key-with-at-least-32-characters \
            api-recommendation:ci \
            -c "from app.main import app; assert '/health/live' in app.openapi()['paths']"

      - name: Upload coverage
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            test-results.xml
          retention-days: 14
