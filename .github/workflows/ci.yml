name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_ONLY_BINARY: ":all:"
      INTEGRATION_ALLOW_DESTRUCTIVE: "true"
      NEO4J_INTEGRATION_URI: bolt://localhost:7687
      NEO4J_INTEGRATION_USER: neo4j
      NEO4J_INTEGRATION_PASSWORD: test-password-for-ci
      NEO4J_INTEGRATION_DATABASE: feeddb
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password-for-ci
          NEO4J_initial_dbms_default__database: feeddb
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Run tests with coverage gate
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65 \
            --junitxml=test-results.xml

      - name: Compile source and tests
        run: python -m compileall -q app tests

      - name: Build and smoke-test container
        run: |
          docker build --tag api-recommendation:ci .
          docker run --rm \
            --entrypoint python \
            --env APP_ENVIRONMENT=test \
            api-recommendation:ci \
            -c "from app.main import app; paths = app.openapi()['paths']; assert '/health/live' in paths and '/feeds/offers' in paths"

      - name: Upload coverage
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            test-results.xml
          retention-days: 14
