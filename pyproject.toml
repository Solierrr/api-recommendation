[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) em argumento default é o padrão idiomático do FastAPI
    "UP042", # str+Enum é mais amplamente compativel que StrEnum (3.11+) e e o padrao usado pelo FastAPI
]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
